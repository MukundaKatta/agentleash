[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentleash"
version = "0.1.0"
description = "Token + dollar caps, vendor allowlist, tool-arg validation, and an audit trail for money-making AI agents. Drop in two lines and your agent can't blow up your bank account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mukunda Rao Katta", email = "mukunda.vjcs6@gmail.com" }]
keywords = [
  "ai",
  "llm",
  "agents",
  "agentic-payments",
  "budget",
  "egress",
  "audit",
  "safety",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "token-budget-py>=0.1.0",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
jsonschema = ["jsonschema>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agentleash"
Source = "https://github.com/MukundaKatta/agentleash"
Issues = "https://github.com/MukundaKatta/agentleash/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentleash"]
